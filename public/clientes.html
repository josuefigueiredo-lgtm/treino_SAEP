<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - Oficina Mecânica</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header id="cabecalho"></header>

    <main class="container">

        <section class="titulo-pagina">
            <div>
                <h2>Clientes</h2>
                <p>O CPF é guardado criptografado e aparece parcialmente na lista.</p>
            </div>
            <button type="button" id="btnNovoCliente" class="primario">Novo cliente</button>
        </section>

        <p id="mensagem" class="mensagem" role="status"></p>

        <section class="painel" id="painelForm" hidden>
            <h3 id="tituloForm">Novo cliente</h3>
            <form id="formCliente">
                <input type="hidden" id="idCliente">
                <div class="grade-form">
                    <div class="campo">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" maxlength="100" required>
                    </div>
                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00" inputmode="numeric" required>
                    </div>
                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" maxlength="20" placeholder="(77) 90000-0000">
                    </div>
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" maxlength="120">
                    </div>
                </div>
                <div class="acoes-form">
                    <button type="submit" class="primario">Salvar cliente</button>
                    <button type="button" id="btnCancelar">Cancelar</button>
                </div>
            </form>
        </section>

        <section class="painel">
            <form id="formBusca" class="busca" role="search">
                <input type="search" id="busca" placeholder="Buscar por nome, CPF, telefone ou e-mail" aria-label="Buscar cliente">
                <button type="submit" class="primario">Buscar</button>
                <button type="button" id="btnLimpar">Limpar busca</button>
            </form>
        </section>

        <section class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Telefone</th>
                        <th>E-mail</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="listaClientes"></tbody>
            </table>
        </section>

    </main>

    <script src="js/api.js"></script>
    <script src="js/clientes.js"></script>

</body>
</html>
